name: Aitomatic
description: >-
  Aitomatic, Inc. (Palo Alto, CA) builds DanaOS, an operating system for
  industrial AI. DanaOS is a governed, neurosymbolic, self-improving platform
  that runs autonomous AI agents inside a customer's own boundary — for
  semiconductor fabs, building and process operations, energy grids, and heavy
  industry. It combines neural flexibility with symbolic precision: a Sector
  Ontology encodes domain expertise as executable knowledge, Small Specialist
  Agents (SSAs) reason over it in a See-Think-Act-Reflect loop, and a governance
  substrate (the Dana Ontologist) verifies every action against ontology and
  policy before it commits — all deployable on-prem and air-gapped. Aitomatic is
  a founding member of the AI Alliance and publishes the open-source Dana
  agent-native language, the OpenSSA framework, and SemiKong, the first
  open-source semiconductor-industry LLM. Founded by Christopher Nguyen (CEO).
